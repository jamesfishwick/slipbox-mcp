version: 2
updates:
  # Python runtime + dev dependencies (pyproject.toml / uv.lock).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"
    ignore:
      # Deliberately pinned to mcp<2: the server uses the v1 FastMCP API.
      # Lift this when the server is ported to v2.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
