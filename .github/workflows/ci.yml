name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version in requires-python and the classifiers.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # Applies to every uv command in the job. Without it, `uv run` falls
      # back to .python-version (3.13) and rebuilds the venv without extras.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras --locked
      # Keep the coverage floor at the established CI baseline.
      - run: uv run pytest -q --cov=slipbox_mcp --cov-report=term-missing --cov-fail-under=75

  lint:
    name: Lint, types, audit, skills drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.13 --all-extras --locked
      - run: uv run ruff check src/ evals/ tests/ scripts/
      - run: uv run ruff format --check src/ evals/ tests/ scripts/
      - run: uv run mypy src/
      # Audit the locked environment the tests install.
      - name: Audit dependencies for known vulnerabilities
        run: uv run --with pip-audit pip-audit
      - name: Skills are regenerated from the prompt templates (no drift)
        run: |
          uv run python scripts/build_skills.py
          git diff --exit-code skills/ \
            || { echo "::error::skills/ is out of date. Run 'python scripts/build_skills.py' and commit."; exit 1; }

  build:
    name: Package builds and passes twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel, then verify metadata
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

  # Branch protection requires a check named "test". This gate keeps that
  # name stable while covering every matrix leg and the other jobs.
  test:
    if: always()
    needs: [tests, lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
