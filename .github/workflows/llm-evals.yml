name: LLM Evals

# Opt-in only. This suite is expensive (~$3-5, ~10 min) and runs on a
# self-hosted runner, so it never triggers automatically — a path-based trigger
# can't tell a real prompt change from a cosmetic reformat, and would queue
# (or bill) on incidental edits. Run it deliberately instead:
#   - add the `run-llm-evals` label to a PR from a branch in this repository
#     (runs once per labeling; remove and re-add the label to run again), or
#   - trigger it manually from the Actions tab (workflow_dispatch).
# For a quick local check without the runner: `pytest evals/llm/ -v`.
#
# Security: the job executes the PR's code on the self-hosted runner, with
# claude running under --dangerously-skip-permissions. Fork PRs never run here,
# and a push does not re-run it, so every run follows a deliberate label on
# code a maintainer has seen.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]

jobs:
  llm-evals:
    # Skipped (no runner allocated) unless explicitly requested.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-llm-evals' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: uv venv && uv pip install -e ".[dev]"
      - name: Run LLM evals
        run: |
          set -e
          activate_cmd="source .venv/bin/activate"

          if [ "$(id -u)" -eq 0 ]; then
            # claude CLI refuses --dangerously-skip-permissions as root.
            # Drop to a non-root user for the eval run.
            useradd --system --create-home --shell /bin/bash evalrunner 2>/dev/null || true
            chown -R evalrunner:evalrunner "$PWD"
            runuser -u evalrunner -- bash -c "$activate_cmd && pytest evals/llm/ -v --tb=short"
          else
            $activate_cmd && pytest evals/llm/ -v --tb=short
          fi
